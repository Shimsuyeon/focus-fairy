<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
	:root { --bg1: #f1ecff; --bg2: #e6f4ff; --fg: #1f1d2b; --muted: #5d5a72; --accent: #6d4aff; }
	@media (prefers-color-scheme: dark) { :root { --bg1: #1d1830; --bg2: #101521; --fg: #ecebf3; --muted: #a9a6bd; --accent: #a891ff; } }
	html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
	body { background: linear-gradient(135deg, var(--bg1), var(--bg2)); color: var(--fg);
		font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; position: relative; }
	.brand { position: absolute; left: 56px; top: 56px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
	.brand img { width: 36px; height: 36px; }
	.copy { position: absolute; left: 56px; top: 250px; width: 330px; }
	.copy h1 { margin: 0 0 18px; font-size: 38px; line-height: 1.3; letter-spacing: -1px; }
	.copy h1 em { font-style: normal; color: var(--accent); }
	.copy p { margin: 0; font-size: 17px; line-height: 1.65; color: var(--muted); }
	iframe { position: absolute; right: 48px; top: 100px; width: 800px; height: 600px; border: 0; border-radius: 16px;
		box-shadow: 0 24px 60px rgb(40 20 90 / 22%), 0 2px 8px rgb(0 0 0 / 8%); background: #fff; }
</style>
</head>
<body>
	<div class="brand"><img src="icons/icon128.png" alt="">집중요정</div>
	<div class="copy"><h1 id="h"></h1><p id="p"></p></div>
	<iframe id="popup"></iframe>
	<script>
		const scene = Number(new URLSearchParams(location.search).get('scene') || 1);
		const copy = {
			1: ['Slack 없이<br><em>툴바에서 바로</em><br>집중 시작·종료', '팝업 하나로 시작하고, 쉬어가고, 끝내요.<br>기록은 Slack 집중요정과 그대로 이어져요.'],
			2: ['카테고리 고르고<br><em>한 번에 시작</em>', '계획을 적고 메시지를 올릴 채널을 골라요.<br>오늘 함께 집중하는 팀원도 한눈에 보여요.'],
			3: ['집중한 날마다<br><em>열매가 열리는</em><br>이번 달의 나무', '월 목표에 가까워질수록 나무가 자라요.<br>일별·누적 그래프와 카테고리 비율까지.'],
		}[scene];
		document.getElementById('h').innerHTML = copy[0];
		document.getElementById('p').innerHTML = copy[1];
		const frame = document.getElementById('popup');
		frame.src = 'popup.html?scene=' + scene;
		frame.addEventListener('load', () => setTimeout(() => {
			const doc = frame.contentDocument;
			if (scene === 2) {
				doc.querySelector('.tag-btn[data-tag="side"]')?.click();
				const plan = doc.getElementById('plan');
				plan.value = '집중요정 익스텐션 스크린샷 만들기\n문서 정리';
			}
			if (scene === 3) doc.querySelector('.segmented button[data-mode="cumulative"]')?.click();
		}, 800));
	</script>
</body>
</html>
